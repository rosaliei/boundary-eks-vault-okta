# -----------------------------------------------------------------------------
# Kubernetes RBAC Configuration for Vault Dynamic Credentials
#
# This file creates three tiers of access for the demo application namespace:
# - viewer:   Read-only access to common resources
# - operator: Viewer + ability to manage deployments, services, configmaps
# - admin:    Full access to all resources in the namespace
#
# Each tier has:
# - Namespace (shared)
# - ServiceAccount (one per role)
# - Role (defines permissions)
# - RoleBinding (connects ServiceAccount to Role)
#
# Vault's Kubernetes secrets engine will generate short-lived tokens for
# these ServiceAccounts, providing dynamic, time-limited credentials.
# -----------------------------------------------------------------------------

---
# =============================================================================
# NAMESPACE
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels:
    app.kubernetes.io/managed-by: "terraform-vault"
    purpose: "demo-application"

---
# =============================================================================
# VIEWER ROLE
# Minimum access: read-only to common Kubernetes resources
# Use case: Developers checking application status, logs, debugging
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-viewer
  namespace: demo-app
  labels:
    app.kubernetes.io/component: "rbac"
    rbac.vault.io/role: "viewer"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: viewer
  namespace: demo-app
  labels:
    app.kubernetes.io/component: "rbac"
    rbac.vault.io/role: "viewer"
rules:
  # Read-only access to core resources
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - secrets       # Read-only secrets (consider restricting in production)
      - events
    verbs: ["get", "list", "watch"]

  # Read-only access to workload resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  # Read-only access to networking resources
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]

  # Read-only access to autoscaling
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer-binding
  namespace: demo-app
  labels:
    app.kubernetes.io/component: "rbac"
    rbac.vault.io/role: "viewer"
subjects:
  - kind: ServiceAccount
    name: vault-viewer
    namespace: demo-app
roleRef:
  kind: Role
  name: viewer
  apiGroup: rbac.authorization.k8s.io

---
# =============================================================================
# OPERATOR ROLE
# Standard access: can manage deployments, services, and configuration
# Use case: DevOps engineers deploying and managing applications
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-operator
  namespace: demo-app
  labels:
    app.kubernetes.io/component: "rbac"
    rbac.vault.io/role: "operator"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operator
  namespace: demo-app
  labels:
    app.kubernetes.io/component: "rbac"
    rbac.vault.io/role: "operator"
rules:
  # Full access to pods (including exec for debugging)
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/portforward
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Manage services and endpoints
  - apiGroups: [""]
    resources:
      - services
      - endpoints
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Manage configmaps (application configuration)
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Read-only secrets (operators shouldn't create secrets directly)
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]

  # View events
  - apiGroups: [""]
    resources:
      - events
    verbs: ["get", "list", "watch"]

  # Full access to deployments, replicasets
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - replicasets
      - replicasets/scale
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Read-only for statefulsets, daemonsets (require admin for changes)
  - apiGroups: ["apps"]
    resources:
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  # Manage ingresses
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Read-only network policies
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs: ["get", "list", "watch"]

  # Manage HPA
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operator-binding
  namespace: demo-app
  labels:
    app.kubernetes.io/component: "rbac"
    rbac.vault.io/role: "operator"
subjects:
  - kind: ServiceAccount
    name: vault-operator
    namespace: demo-app
roleRef:
  kind: Role
  name: operator
  apiGroup: rbac.authorization.k8s.io

---
# =============================================================================
# ADMIN ROLE
# Full access: complete control over namespace resources
# Use case: Platform engineers, namespace owners, emergency access
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-admin
  namespace: demo-app
  labels:
    app.kubernetes.io/component: "rbac"
    rbac.vault.io/role: "admin"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin
  namespace: demo-app
  labels:
    app.kubernetes.io/component: "rbac"
    rbac.vault.io/role: "admin"
rules:
  # Full access to all core API resources
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["*"]

  # Full access to apps API group
  - apiGroups: ["apps"]
    resources: ["*"]
    verbs: ["*"]

  # Full access to batch (jobs, cronjobs)
  - apiGroups: ["batch"]
    resources: ["*"]
    verbs: ["*"]

  # Full access to networking
  - apiGroups: ["networking.k8s.io"]
    resources: ["*"]
    verbs: ["*"]

  # Full access to autoscaling
  - apiGroups: ["autoscaling"]
    resources: ["*"]
    verbs: ["*"]

  # Full access to policy (PodDisruptionBudgets)
  - apiGroups: ["policy"]
    resources: ["*"]
    verbs: ["*"]

  # RBAC management within namespace
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-binding
  namespace: demo-app
  labels:
    app.kubernetes.io/component: "rbac"
    rbac.vault.io/role: "admin"
subjects:
  - kind: ServiceAccount
    name: vault-admin
    namespace: demo-app
roleRef:
  kind: Role
  name: admin
  apiGroup: rbac.authorization.k8s.io

---
# =============================================================================
# VAULT'S OWN CREDENTIAL — how Vault authenticates to the Kubernetes API
#
# Vault does not create the ServiceAccounts above; it mints short-lived tokens
# FOR them via the TokenRequest API. To do that it needs its own credential.
#
# Two properties matter here, and they must land together:
#
#   1. resourceNames — without it, "create serviceaccounts/token" means "mint a
#      token for ANY ServiceAccount in the cluster", including ones bound to
#      cluster-admin. That is a privilege-escalation path.
#
#   2. a non-expiring credential — kubectl create token --duration=8760h is
#      silently capped by the API server (measured: EKS grants exactly 24h), so
#      a TokenRequest token dies a day later with an error that blames the
#      ServiceAccount it was minting FOR. A Secret of type
#      kubernetes.io/service-account-token has no exp claim at all.
#
# Attaching (2) without (1) is strictly worse than doing neither.
#
# If Vault runs INSIDE this cluster, none of this is needed: bind the Role to
# the Vault pod's own ServiceAccount and use `vault write -f kubernetes/config`
# with no arguments. Vault then reads its own projected token, which the kubelet
# rotates forever. This block is the EXTERNAL-Vault shape.
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: demo-app
  labels:
    app.kubernetes.io/component: "rbac"
    rbac.vault.io/role: "token-minter"
---
# Namespaced Role, NOT a ClusterRole: a ClusterRole with resourceNames restricts
# by name but not by namespace, so a "vault-viewer" in any other namespace would
# also match.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-token-creator
  namespace: demo-app
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames: ["vault-viewer", "vault-operator", "vault-admin"]
  # Reading a ServiceAccount is harmless; minting a token as one is not.
  # resourceNames cannot restrict "list", so only "get" is granted.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-token-creator
  namespace: demo-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-token-creator
subjects:
  - kind: ServiceAccount
    name: vault-secrets
    namespace: demo-app
---
# Since Kubernetes 1.24 these are not auto-created. The token inside has no exp
# claim. Treat it as a credential: it is long-lived by design.
apiVersion: v1
kind: Secret
metadata:
  name: vault-secrets-token
  namespace: demo-app
  annotations:
    kubernetes.io/service-account.name: vault-secrets
type: kubernetes.io/service-account-token
