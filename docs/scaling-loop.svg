<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 864" width="1560" height="864" role="img" aria-label="The access layer scales itself: sessions flow through a worker pool whose own session gauge feeds Datadog monitors, which fire webhooks to a GitHub Actions workflow that resizes the Auto Scaling group, closing the loop">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f6b64"/></marker>
</defs>

<rect x="0" y="0" width="1560" height="864" fill="#fbf9f6"/>

<!-- header -->
<text x="70" y="64" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#1c1b19">The access layer scales itself</text>
<text x="70" y="92" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6f6b64">A pool of Boundary workers on one Auto Scaling group — the pool measures the demand it serves, and sizes itself.</text>

<!-- ================= top row ================= -->
<!-- N1 worker pool -->
<rect x="70" y="140" width="340" height="132" rx="12" fill="#ffffff" stroke="#6f6b64" stroke-width="1.2"/>
<text x="92" y="176" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1c1b19">Worker pool</text>
<text x="92" y="202" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">Boundary workers on an EC2 ASG, 1 to 6</text>
<text x="92" y="220" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">public subnets, registered with HCP Boundary</text>
<text x="92" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1c1b19">:9202 proxy, direct ingress · :9203 /metrics</text>

<!-- N2 datadog agent -->
<rect x="610" y="140" width="340" height="132" rx="12" fill="#ffffff" stroke="#6f6b64" stroke-width="1.2"/>
<text x="632" y="176" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1c1b19">Datadog Agent</text>
<text x="632" y="202" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">one agent per worker host</text>
<text x="632" y="220" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">gauge scraped every 15 s</text>
<text x="632" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1c1b19">boundary.worker.active_sessions</text>

<!-- N3 datadog monitors -->
<rect x="1150" y="140" width="340" height="132" rx="12" fill="#ffffff" stroke="#6f6b64" stroke-width="1.2"/>
<text x="1172" y="176" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1c1b19">Datadog monitors</text>
<text x="1172" y="202" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">average sessions per worker</text>
<rect x="1172" y="228" width="140" height="28" rx="8" fill="#f7e6da" stroke="#b4530a" stroke-width="1.1"/>
<text x="1242" y="246" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#b4530a">OUT · 5m &gt; 10</text>
<rect x="1328" y="228" width="140" height="28" rx="8" fill="#e4efe9" stroke="#2f7d5d" stroke-width="1.1"/>
<text x="1398" y="246" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#2f7d5d">IN · 15m &lt; 3</text>

<!-- E1 worker -> agent -->
<line x1="410" y1="206" x2="603" y2="206" stroke="#6f6b64" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="510" y="178" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">worker reports</text>
<text x="510" y="196" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">open connections</text>

<!-- E2 agent -> monitors -->
<line x1="950" y1="206" x2="1143" y2="206" stroke="#6f6b64" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1050" y="178" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">average sessions</text>
<text x="1050" y="196" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">per worker, by asg tag</text>

<!-- E3 monitors -> workflow (down the right edge) -->
<line x1="1320" y1="272" x2="1320" y2="443" stroke="#6f6b64" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1296" y="336" text-anchor="end" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">monitor fires →</text>
<text x="1296" y="354" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1c1b19">webhook → repository_dispatch</text>

<!-- center annotation: the metric -->
<text x="870" y="368" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#1c1b19">avg:boundary.worker.active_sessions{asg:…}</text>
<text x="870" y="386" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6f6b64">the one metric the whole loop runs on</text>

<!-- ================= bottom row ================= -->
<!-- N5 auto scaling group -->
<rect x="70" y="470" width="340" height="132" rx="12" fill="#ffffff" stroke="#6f6b64" stroke-width="1.2"/>
<text x="92" y="506" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1c1b19">Auto Scaling group</text>
<text x="92" y="532" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">launches or terminates one worker</text>
<text x="92" y="554" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1c1b19">aws autoscaling set-desired-capacity</text>
<text x="92" y="576" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">desired capacity clamped to 1–6</text>

<!-- N4 github actions -->
<rect x="1150" y="470" width="340" height="132" rx="12" fill="#ffffff" stroke="#6f6b64" stroke-width="1.2"/>
<text x="1172" y="506" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1c1b19">GitHub Actions</text>
<text x="1172" y="532" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">scale.yml on repository_dispatch</text>
<text x="1172" y="554" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1c1b19">OIDC role, no static keys</text>
<text x="1172" y="576" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">one run per monitor fire</text>

<!-- E4 workflow -> asg (right to left) -->
<line x1="1150" y1="536" x2="417" y2="536" stroke="#6f6b64" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="783" y="508" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">moves desired capacity ±1</text>
<text x="783" y="526" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1c1b19">--honor-cooldown</text>

<!-- E5 asg -> worker pool (up the left edge, the loop closing) -->
<line x1="240" y1="470" x2="240" y2="279" stroke="#6f6b64" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="290" y="296" width="356" height="64" rx="8" fill="#f7e6da" stroke="#b4530a" stroke-width="1.1"/>
<text x="306" y="320" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b4530a">+1 — scale OUT</text>
<text x="306" y="338" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c1b19">new worker boots and registers itself</text>
<text x="306" y="354" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c1b19">with HCP Boundary</text>
<rect x="290" y="376" width="356" height="64" rx="8" fill="#e4efe9" stroke="#2f7d5d" stroke-width="1.1"/>
<text x="306" y="400" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#2f7d5d">−1 — scale IN</text>
<text x="306" y="418" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c1b19">lifecycle hook pauses termination; worker</text>
<text x="306" y="434" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c1b19">drains, deregisters — fails open</text>
<text x="290" y="462" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#6f6b64">the loop closes — the pool sizes itself to the demand it serves</text>

<!-- ================= three decisions ================= -->
<rect x="70" y="630" width="453" height="150" rx="12" fill="#f5f2ec"/>
<text x="92" y="664" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#b4530a">01</text>
<text x="128" y="664" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1c1b19">Sessions are the signal, not CPU</text>
<text x="92" y="690" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">A proxy is busy when people are connected</text>
<text x="92" y="707" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">through it; its CPU barely moves either way.</text>
<text x="92" y="724" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">A CPU alarm would never fire.</text>

<rect x="553" y="630" width="453" height="150" rx="12" fill="#f5f2ec"/>
<text x="575" y="664" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2b5f8e">02</text>
<text x="611" y="664" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1c1b19">Datadog decides, GitHub acts</text>
<text x="575" y="690" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">The monitor holds the metric but cannot touch</text>
<text x="575" y="707" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">an ASG, so it calls a workflow that can. When</text>
<text x="575" y="724" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">nothing scales, look at the workflow run.</text>

<rect x="1036" y="630" width="453" height="150" rx="12" fill="#f5f2ec"/>
<text x="1058" y="664" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2f7d5d">03</text>
<text x="1094" y="664" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1c1b19">A worker deregisters itself before it dies</text>
<text x="1058" y="690" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">A lifecycle hook pauses termination while the</text>
<text x="1058" y="707" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">worker finishes its sessions and deletes its</text>
<text x="1058" y="724" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">Boundary record — and fails open, so a broken</text>
<text x="1058" y="741" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6f6b64">script can never wedge the pool.</text>

<!-- footer -->
<text x="70" y="826" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6f6b64">sources — autoscaling/datadog: monitors + webhooks · autoscaling/asg: the pool · .github/workflows/scale.yml: the actor</text>
</svg>
