<line x1="58" y1="608" x2="98" y2="608" stroke="#8b867d" stroke-width="1.6"/>
<polygon points="98,608 92,604.28 92,611.72" fill="#8b867d"/>
<text x="110" y="612" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f6b64" font-weight="normal" text-anchor="start">a new connection is opened in this direction</text>
<line x1="58" y1="634" x2="98" y2="634" stroke="#3a6ea8" stroke-width="1.6" stroke-dasharray="5 4"/>
<polygon points="98,634 92,630.28 92,637.72" fill="#8b867d"/>
<text x="110" y="638" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3a6ea8" font-weight="normal" text-anchor="start">outbound tunnel setup — the worker initiates, always</text>
<line x1="58" y1="660" x2="98" y2="660" stroke="#3f7a55" stroke-width="1.6"/>
<polygon points="98,660 92,656.28 92,663.72" fill="#8b867d"/>
<text x="110" y="664" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3f7a55" font-weight="normal" text-anchor="start">credential brokering, entirely inside the VPC</text>
<text x="40" y="784" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c1b19" font-weight="bold" text-anchor="start">Nothing in this diagram accepts an inbound connection from the internet.</text>
<text x="40" y="804" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6f6b64" font-weight="normal" text-anchor="start">The worker has no public IP and no inbound rule; it reaches HCP through NAT and holds that tunnel open. HCP pushes session bytes back down it.</text>
<text x="40" y="824" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6f6b64" font-weight="normal" text-anchor="start">That is what makes a private EKS endpoint reachable without a VPN, a bastion, or opening the API server to the world.</text>
<text x="300" y="348" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#3a6ea8" font-weight="bold" text-anchor="start">2 · worker dials OUT :9202 through NAT</text>
<text x="300" y="364" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f6b64" text-anchor="start">and holds that tunnel open</text>
<text x="300" y="392" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c1b19" font-weight="bold" text-anchor="start">3 · session bytes ride that tunnel</text>
<text x="300" y="408" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6f6b64" text-anchor="start">HCP never opens an inbound connection</text>
</svg>