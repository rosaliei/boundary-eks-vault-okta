<text x="1000" y="394" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6f6b64" font-weight="normal" text-anchor="middle">TCP 443 · TLS terminates at EKS</text>
