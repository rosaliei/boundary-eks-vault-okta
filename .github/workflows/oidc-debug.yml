# TEMPORARY diagnostic. Prints the claims GitHub puts in the OIDC token so the
# IAM trust policy can be matched against reality instead of assumption.
# Claims are not secrets (sub/aud/iss are public identifiers); the token itself
# is never printed. Delete this workflow once the trust policy is confirmed.
name: oidc-debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Show OIDC claims
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          c = json.loads(base64.urlsafe_b64decode(payload))
          for k in ("iss", "aud", "sub", "repository", "repository_owner", "ref", "workflow"):
              print("%-18s %s" % (k, c.get(k)))
          PY
